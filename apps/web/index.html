<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="See what SakuraCord is building next, organized into a calm version-by-version roadmap."
    />
    <meta name="theme-color" content="#0c0b10" />
    <style>
      :root {
        color-scheme: dark;
        background: __ROADMAP_BACKGROUND__;
        color: #f8f6f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ink: __ROADMAP_BACKGROUND__;
        --text: #f8f6f8;
        --muted: #aaa5ad;
        --border: rgba(255, 255, 255, 0.12);
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: var(--ink);
        color: var(--text);
      }
      .skip-link {
        position: fixed;
        z-index: 100;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        border-radius: 8px;
        color: #0c0b10;
        background: #f7c3dc;
        font-weight: 700;
        transform: translateY(-160%);
      }
      .skip-link:focus {
        transform: translateY(0);
      }
      .app-shell {
        min-height: 100vh;
        background: var(--ink);
      }
      .site-header {
        position: sticky;
        z-index: 20;
        top: 0;
        height: 54px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(12, 11, 16, 0.86);
      }
      .header-inner {
        position: relative;
        display: flex;
        width: min(1120px, calc(100% - 48px));
        height: 100%;
        margin-inline: auto;
        align-items: center;
        justify-content: space-between;
      }
      .site-brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--text);
        text-decoration: none;
        font-size: 17px;
        font-weight: 680;
        letter-spacing: -0.025em;
      }
      .site-brand img {
        width: 30px;
        height: 30px;
        border-radius: 8px;
      }
      .primary-navigation {
        display: flex;
        align-items: center;
        gap: 23px;
        color: #bbb6bd;
        font-size: 13px;
        font-weight: 560;
      }
      .primary-navigation a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: inherit;
        text-decoration: none;
      }
      .primary-navigation a > svg {
        width: 15px;
        height: 15px;
        flex: none;
      }
      .primary-navigation a.nav-download {
        min-height: 34px;
        padding-inline: 13px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--radius);
        color: var(--text);
        background: rgba(255, 255, 255, 0.07);
        font-weight: 650;
      }
      .menu-button {
        display: none;
        width: 36px;
        height: 34px;
        padding: 0;
        place-content: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--radius);
        color: var(--text);
        background: rgba(255, 255, 255, 0.07);
      }
      .menu-button svg {
        width: 17px;
        height: 17px;
        fill: currentColor;
      }
      .preboot-content {
        width: min(1180px, calc(100% - 96px));
        margin-inline: auto;
        padding-top: 70px;
      }
      .preboot-heading {
        width: min(360px, 55vw);
        height: 58px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
      }
      .preboot-line {
        width: min(760px, 76vw);
        height: 18px;
        margin-top: 54px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.055);
      }
      .preboot-line + .preboot-line {
        width: min(610px, 62vw);
        margin-top: 18px;
      }
      @media (max-width: 900px) {
        .header-inner {
          width: calc(100% - 36px);
        }
        .menu-button {
          display: grid;
        }
        .primary-navigation {
          display: none;
        }
      }
      @media (max-width: 760px) {
        .preboot-content {
          width: calc(100% - 32px);
          padding-top: 52px;
        }
      }
    </style>
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="preload" as="font" type="font/ttf" href="/fonts/LAText-VF.ttf" crossorigin />
    <link rel="preload" as="font" type="font/ttf" href="/fonts/LADisplay-VF.ttf" crossorigin />
    <title>SakuraCord Roadmap</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="root">
      <div class="app-shell">
        <!-- roadmap-preboot-header -->
        <main
          id="main-content"
          class="preboot-content"
          aria-busy="true"
          aria-label="Loading published plans"
        >
          <div class="preboot-heading" aria-hidden="true"></div>
          <div class="preboot-line" aria-hidden="true"></div>
          <div class="preboot-line" aria-hidden="true"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
